[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/qk-core", "crates/qk-store", "crates/qk-ssh", "crates/qk-collect", "crates/qk-jobs", "crates/qk-auth", "crates/qk-intel", "crates/quietkeep"]

[workspace.package]
version = "0.15.0"
